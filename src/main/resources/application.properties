spring.application.name=TREEdu
server.port=3001
api.base-url=http://localhost:3001/api
# application.properties
logging.level.vn.hcmute.edu.materialsservice=DEBUG

spring.data.mongodb.uri=mongodb://localhost:27017/materials_db

# Disable JPA auto-configuration (we're using MongoDB only)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# API KEY
gemini.api.key=${GEMINI_API_KEY}
fpt.api-key=${FPT_API_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

spring.mail.test-connection=false
spring.mail.default-encoding=UTF-8

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=uploads/audio/
app.base-url=http://localhost:8080

# URL c?a AI Python service
ai.service.url=http://localhost:8000/ai/v1/transcribe

# Cloudinary config 
cloudinary.url=${CLOUDINARY_URL}
cloudinary.avatar-folder=avatars

spring.data.mongodb.auto-index-creation=true